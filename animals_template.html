<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Animal Repository</title>

    <style>
        html {
            background-color: #ffe9e9;
        }

        body {
            font-family: 'Roboto', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 400;
            letter-spacing: 0;
            padding: 1rem;
            width: 900px;
            margin: auto;
            background-color: #ffe9e9;
        }

        h1 {
            text-align: center;
            font-size: 40pt;
            font-weight: normal;
            color: #444444;
        }

        .cards {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .cards__item {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 20px 40px -14px rgba(0,0,0,0.25);
            overflow: hidden;
            padding: 1.5rem;
            margin: 40px 0;
        }

        .card__title {
            color: #444444;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .card__text {
            font-size: 0.95rem;
            line-height: 2;
            margin: 0;
        }

        strong {
            font-weight: bold;
        }

    </style>

</head>

</html>
